# Copy into Apache after unzip (this file lives next to index.php in InPmnt-PHP.zip):
#   sudo bash fix-ubuntu-perms.sh
#   sudo cp apache-html.conf /etc/apache2/conf-available/inpmnt-html.conf
#   sudo a2enconf inpmnt-html
#   sudo a2enmod rewrite
#   sudo systemctl reload apache2

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride All
    DirectoryIndex index.php
    AcceptPathInfo On
    FallbackResource /index.php
    Require all granted
</Directory>
