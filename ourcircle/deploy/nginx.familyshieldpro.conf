# Family Shield Pro — Nginx
# setup-ubuntu.sh copies this and replaces YOUR_DOMAIN.
# After DNS is live:
#   sudo certbot --nginx -d familyshieldpro.com -d www.familyshieldpro.com

server {
    listen 80;
    listen [::]:80;
    server_name www.YOUR_DOMAIN;
    return 301 http://YOUR_DOMAIN$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 10M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:5065;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
