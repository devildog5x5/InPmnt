{% extends "base.html" %}
{% block title %}Choose a new password · OurCircle{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    {% with brand_sub="New password" %}{% include "_brand.html" %}{% endwith %}
    {% include "_flashes.html" %}
    <form method="post">
      <label>New password (8+)</label>
      <input name="password" type="password" required minlength="8" autocomplete="new-password" />
      <p><button class="btn wide" type="submit">Save password</button></p>
    </form>
  </div>
</div>
{% endblock %}
