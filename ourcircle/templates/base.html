<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}OurCircle · Family Shield Pro{% endblock %}</title>
  <meta name="robots" content="{% block robots %}index,follow{% endblock %}" />
  <link rel="canonical" href="{{ site_home }}{{ request.path if request.path != '/' else '/' }}" />
  <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ site_home }}/sitemap.xml" />
  <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body>
  {% block body %}{% endblock %}
  {% include "support_chat.html" %}
</body>
</html>
