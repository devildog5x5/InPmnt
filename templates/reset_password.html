<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password · InPmnt</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/inpmnt-icon.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-logo img" aria-hidden="true">
          <img src="{{ url_for('static', filename='img/inpmnt-icon.png') }}" alt="" />
        </div>
        <div>
          <div class="brand-mark" style="color:var(--ink);font-size:1.35rem">InPmnt</div>
          <div class="brand-sub" style="color:var(--muted)">Get paid without the chase</div>
        </div>
      </div>
      <h1>Choose a new password</h1>
      <p class="lead">Pick a password at least 8 characters long.</p>
      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}
      {% if show_form %}
      <form method="post">
        <input type="hidden" name="token" value="{{ token }}" />
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password_confirm">Confirm password</label>
          <input id="password_confirm" name="password_confirm" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button class="btn" type="submit">Update password</button>
      </form>
      {% endif %}
      <p class="auth-foot">
        <a href="{{ url_for('main.forgot_password') }}">Request a new link</a><br />
        <a href="{{ url_for('main.login') }}">← Back to log in</a>
      </p>
    </div>
  </div>
</body>
</html>
