# Drop-in for Apache2 document root /var/www/html
# From a git clone: sudo cp deploy/apache-html.conf /etc/apache2/conf-available/inpmnt-html.conf
# From InPmnt-PHP.zip: sudo cp apache-html.conf /etc/apache2/conf-available/inpmnt-html.conf
#   sudo a2enconf inpmnt-html
#   sudo a2enmod rewrite
#   sudo bash /var/www/html/fix-ubuntu-perms.sh
#   sudo systemctl reload apache2

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride All
    DirectoryIndex index.php
    AcceptPathInfo On
    FallbackResource /index.php
    Require all granted
</Directory>
