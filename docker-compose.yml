# InPmnt on Linux (Docker)
#   docker compose up -d --build
#   open http://127.0.0.1:5055
# Demo: trialuser@inpmnt.app / LIfeMadeUSMCForged100!
#
# Optional: copy .env.example → .env and add Stripe keys / BASE_URL.

services:
  inpmnt:
    build: .
    image: inpmnt:latest
    container_name: inpmnt
    restart: unless-stopped
    ports:
      - "${INPMNT_PORT:-5055}:5055"
    environment:
      PORT: "5055"
      USE_HTTPS: "0"
      DATABASE_PATH: /app/data/inpmnt.db
      BASE_URL: ${BASE_URL:-http://127.0.0.1:5055}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    env_file:
      - path: .env
        required: false
    volumes:
      - inpmnt-data:/app/data

volumes:
  inpmnt-data:
